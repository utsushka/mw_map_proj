<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#14110d"/>
  <meta name="description" content="Атлас Вварденфелла — интерактивная карта локаций Morrowind, Bloodmoon и Tamriel Rebuilt."/>
  <title>Атлас Вварденфелла — интерактивная карта Morrowind</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 29 27H3Z' fill='none' stroke='%23d8b36a' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='19' r='3.4' fill='%23ff5a2a'/%3E%3C/svg%3E"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;0,700;1,500;1,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    body{margin:0;background:#100d0a;color:#ede3cd;font-family:system-ui,sans-serif}
    .boot{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
    .boot h1{font:700 24px Georgia,serif;letter-spacing:.2em;color:#f0cf8a;margin:0}
    .boot p{color:#8a7c64;font-size:13px;margin:0}
    .boot .bar{width:180px;height:3px;border-radius:2px;background:#241e16;overflow:hidden}
    .boot .bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#ff5a2a,#d8b36a);animation:bl 1.1s ease-in-out infinite alternate}
    @keyframes bl{from{transform:translateX(-40%)}to{transform:translateX(260%)}}
  </style>
</head>
<body>
  <div id="root">
    <div class="boot">
      <svg width="60" height="60" viewBox="0 0 32 32"><path d="M16 3 29 27H3Z" fill="none" stroke="#d8b36a" stroke-width="2"/><circle cx="16" cy="19" r="3.4" fill="#ff5a2a"/></svg>
      <h1>АТЛАС ВВАРДЕНФЕЛЛА</h1>
      <div class="bar"><i></i></div>
      <p>Разворачиваем свитки…</p>
    </div>
  </div>
  <noscript><p style="padding:24px;text-align:center">Для атласа нужен включённый JavaScript.</p></noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
